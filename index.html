<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脚本分镜工具</title>
<style>
  :root{--pri:#2563eb;--text:#1b1f24;--muted:#6b7280;--line:#e3e6ea;--red:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:var(--text)}
  .box{width:370px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 28px;box-shadow:0 8px 28px rgba(20,30,50,.07)}
  h1{font-size:17px;margin:0 0 5px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}
  input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;outline:none}
  input[type=password]:focus{border-color:var(--pri);box-shadow:0 0 0 3px #eff4ff}
  button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:9px;background:var(--pri);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:18px}
  .remember{display:flex;align-items:center;gap:6px;margin-top:14px;color:var(--muted);font-size:12.5px}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#f5f6f8}
  body.unlocked .box{display:none}
  body.unlocked #frame{display:block}
</style>
</head>
<body>
<iframe id="frame" referrerpolicy="no-referrer"></iframe>
<div class="box">
  <h1>脚本分镜工具</h1>
  <div class="sub">请输入访问口令</div>
  <form id="f">
    <input id="pw" type="password" placeholder="口令" autocomplete="current-password" autofocus>
    <button id="go" type="submit">进入</button>
    <label class="remember"><input type="checkbox" id="rm" checked style="width:auto;margin:0"> 记住口令（仅本机浏览器）</label>
  </form>
  <div class="err" id="err"></div>
</div>
<script src="payload.js?v=1789976312901"></script>
<script>
const P = window.__LOCKED_PAYLOAD, LS_KEY = 'fj_lock_pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);

async function tryUnlock(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(P.salt), iterations: 300000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
  document.body.classList.add('unlocked');
  document.getElementById('frame').srcdoc = new TextDecoder().decode(plain);
}
async function attempt(pw) {
  $('err').textContent = ''; $('go').disabled = true; $('go').textContent = '解锁中…';
  try {
    if ($('rm').checked) localStorage.setItem(LS_KEY, pw); else localStorage.removeItem(LS_KEY);
    await tryUnlock(pw);
  } catch (e) {
    localStorage.removeItem(LS_KEY);
    $('err').textContent = '口令不对，请重新输入';
    $('go').disabled = false; $('go').textContent = '进入';
    $('pw').value = ''; $('pw').focus();
  }
}
$('f').addEventListener('submit', e => { e.preventDefault(); attempt($('pw').value); });
const saved = localStorage.getItem(LS_KEY);
if (saved) { $('pw').value = saved; attempt(saved); }
</script>
</body>
</html>
